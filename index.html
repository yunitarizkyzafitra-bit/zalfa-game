    <h1>✨ Aplikasi Mewarnai Seru ✨</h1>
    
    <div class="container">
        <!-- Area Kanvas Gambar -->
        <div class="canvas-container">
            <canvas id="paintCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Pilihan Warna Berdasarkan Palet Gambar Anda -->
        <div class="palette" id="colorPalette">
            <!-- Warna kustom dari palet -->
            <div class="color-swatch selected" style="background-color: #30afff;" data-color="#30afff"></div>
            <div class="color-swatch" style="background-color: #92eeff;" data-color="#92eeff"></div>
            <div class="color-swatch" style="background-color: #d8ffc5;" data-color="#d8ffc5"></div>
            <div class="color-swatch" style="background-color: #c4f7ca;" data-color="#c4f7ca"></div>
            <!-- Warna tambahan untuk variasi dewasa & anak -->
            <div class="color-swatch" style="background-color: #ff6b6b;" data-color="#ff6b6b"></div>
            <div class="color-swatch" style="background-color: #ffd93d;" data-color="#ffd93d"></div>
            <div class="color-swatch" style="background-color: #6c5ce7;" data-color="#6c5ce7"></div>
            <div class="color-swatch" style="background-color: #2d3436;" data-color="#2d3436"></div>
            <input type="color" id="customColor" value="#30afff" style="width: 32px; height: 32px; border: none; cursor: pointer; border-radius: 50%;">
        </div>

        <!-- Panel Tools / Alat -->
        <div class="toolbar">
            <div class="tool-group">
                <button id="brushBtn" class="active" onclick="setTool('brush')">🖌️ Kuas</button>
                <button id="eraserBtn" onclick="setTool('eraser')">🧹 Penghapus</button>
            </div>

            <div class="tool-group">
                <span class="slider-label">Ukuran:</span>
                <input type="range" id="brushSize" min="2" max="30" value="8" onchange="setBrushSize(this.value)">
            </div>

            <div class="tool-group">
                <button onclick="clearCanvas()">🔄 Reset</button>
                <button onclick="saveImage()">💾 Simpan</button>
            </div>
        </div>

        <!-- Pilihan Pola Gambar -->
        <div class="toolbar" style="margin-top: 10px;">
            <span class="slider-label">Pilih Pola:</span>
            <button onclick="loadTemplate('flower')">🌸 Bunga</button>
            <button onclick="loadTemplate('mandala')">🌀 Mandala</button>
            <button onclick="loadTemplate('star')">⭐ Bintang</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        let painting = false;
        let currentTool = 'brush';
        let currentColor = '#30afff';
        let brushSize = 8;

        // Inisialisasi latar belakang putih bersih
        function initCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawTemplate('flower'); // Default template
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('brushBtn').classList.remove('active');
            document.getElementById('eraserBtn').classList.remove('active');
            if(tool === 'brush') document.getElementById('brushBtn').classList.add('active');
            if(tool === 'eraser') document.getElementById('eraserBtn').classList.add('active');
        }

        function setBrushSize(size) {
            brushSize = size;
        }

        // Pengaturan Event Warna Palet
        const swatches = document.querySelectorAll('.color-swatch');
        swatches.forEach(swatch => {
            swatch.addEventListener('click', (e) => {
                swatches.forEach(s => s.classList.remove('selected'));
                e.target.classList.add('selected');
                currentColor = e.target.getAttribute('data-color');
                setTool('brush');
            });
        });

        document.getElementById('customColor').addEventListener('input', (e) => {
            currentColor = e.target.value;
            setTool('brush');
        });

        // Fungsi Menggambar
        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;

            // Mendukung sentuhan mobile maupun mouse desktop
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'brush') {
                ctx.strokeStyle = currentColor;
            } else if (currentTool === 'eraser') {
                ctx.strokeStyle = '#ffffff'; // Menghapus dengan warna putih
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Event Listeners Mouse & Touch
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw);

        // Template Gambar (Garis Hitam untuk Diwarnai)
        let currentTemplateName = 'flower';
        function loadTemplate(name) {
            currentTemplateName = name;
            // Clear area tapi pertahankan garis template
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawTemplate(name);
        }

        function drawTemplate(name) {
            ctx.strokeStyle = '#2d3436';
            ctx.lineWidth = 3;
            ctx.beginPath();

            if (name === 'flower') {
                // Gambar Bunga sederhana (Cocok untuk Anak)
                ctx.arc(200, 200, 40, 0, Math.PI * 2);
                for (let i = 0; i < 6; i++) {
                    let angle = (i * Math.PI) / 3;
                    let cx = 200 + Math.cos(angle) * 60;
                    let cy = 200 + Math.sin(angle) * 60;
                    ctx.moveTo(cx + 30, cy);
                    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
                }
            } else if (name === 'mandala') {
                // Pola Mandala (Cocok untuk Dewasa/Relaksasi)
                ctx.translate(200, 200);
                for (let i = 0; i < 12; i++) {
                    ctx.rotate(Math.PI / 6);
                    ctx.arc(0, 0, 150, 0, Math.PI / 4);
                    ctx.rect(20, 20, 80, 80);
                }
                ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
            } else if (name === 'star') {
                // Gambar Bintang
                ctx.translate(200, 200);
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 100, -Math.sin((18 + i * 72) * Math.PI / 180) * 100);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 40, -Math.sin((54 + i * 72) * Math.PI / 180) * 40);
                }
                ctx.closePath();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }
            ctx.stroke();
        }

        function clearCanvas() {
            loadTemplate(currentTemplateName);
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = 'hasil-mewarnai.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Jalankan saat pertama kali dimuat
        initCanvas();
    </script>
</body>
