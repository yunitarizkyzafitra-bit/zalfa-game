<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Bintang Cilik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🌟 Petualangan Bintang Cilik 🌟</h1>
        <div id="score-board">Bintang Terkumpul: <span id="score">0</span></div>
        
        <div id="play-area">
            <!-- Tombol Bintang Interaktif -->
            <button id="spawn-btn" onclick="catchStar()">Ambil Bintang! ⭐</button>
        </div>

        <div id="message">Ayo kumpulkan bintang sebanyak-banyaknya!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
